[package]
name = "athena-adbc"
version = "0.1.0"
edition = "2024"

[dependencies]
adbc_core = "0.23.0"
adbc_ffi = { version = "0.23.0", optional = true }
arrow-array = "58.1.0"
arrow-schema = "58.1.0"
aws-config = "1.8.13"
aws-sdk-athena = "1.100.0"
tokio = { version = "1.51.1", features = ["full"] }

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
ffi = ["dep:adbc_ffi"]

[dev-dependencies]
assertables = "9.9.0"
aws-sdk-athena = { version = "1.100.0", features = ["test-util"] }
aws-smithy-mocks = "0.2.6"
